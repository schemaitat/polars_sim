[package]
name = "polars-simed"
version = "0.3.4"
edition = "2021"

[lib]

name = "polars_simed_lib"
crate-type = ["cdylib"]
test = true
path = "src/lib.rs"

[dependencies]
itertools = "0.13.0"
lazy_static = "1.5.0"
ngrams = "1.0.1"
num = "0.4.3"
polars = { version = "0.51.0", features = ["dtype-array"] }
polars-core = { version = "0.51.0", features = ["dtype-array"] }
polars-lazy = "0.51.0"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "0.24.0", features = ["derive", "lazy"] }
rayon = "1.10.0"

